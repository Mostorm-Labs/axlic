name: A2 Windows evidence

on:
  push:
    branches:
      - codex/axl-v1-a2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-release:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install frozen Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.13.15

      - name: Install frozen verification tools
        run: python -m pip install --disable-pip-version-check cmake==4.4.2 cryptography==50.0.1

      - name: Verify frozen toolchain availability
        shell: pwsh
        run: |
          if ((cmake --version | Select-Object -First 1) -ne 'cmake version 4.4.2') { throw 'CMake 4.4.2 is required' }
          if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0')) { throw 'Windows SDK 10.0.26100.0 is required' }

      - name: Configure x64 Release
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v143

      - name: Build x64 Release
        run: cmake --build build --config Release --parallel

      - name: Run frozen unit and process suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $junit = Join-Path $PWD 'evidence/ctest.xml'
          ctest --test-dir build -C Release --output-on-failure --output-junit $junit

      - name: Produce A2 library-plane CLI contract report
        run: >-
          python client/tests/test_a2_cli.py
          --exe build/client/Release/axlic_a2_cli_scenario.exe
          --vectors reference/vectors/a2/install.json
          --implementation-revision ${{ github.sha }}
          --report evidence/a2-cli-contract.json

      - name: Verify A2 install vectors regenerate deterministically
        shell: pwsh
        run: |
          python reference/tools/a2_reference.py --generate --output evidence/install-regenerated.json
          if (Compare-Object (Get-Content reference/vectors/a2/install.json) (Get-Content evidence/install-regenerated.json)) {
            throw 'reference/vectors/a2/install.json drifted from the independent generator'
          }

      - name: Independent canonical and crypto cross-check
        run: >-
          python reference/tools/a0_reference.py --check
          --implementation-revision ${{ github.sha }}
          --report evidence/independent-reference.json

      - name: Produce inherited A0 CLI report
        run: >-
          python client/tests/test_cli.py
          --exe build/client/Release/axlic_a0_fixture_cli.exe
          --vectors reference/vectors/a0/corpus.json
          --valid-state reference/vectors/a0/valid_state.json
          --absent-state reference/vectors/a0/absent_state.json
          --implementation-revision ${{ github.sha }}
          --report evidence/a0-cli-regression.json

      - name: Prove inherited A0 offline boundary
        run: >-
          python client/tests/verify_offline_boundary.py
          --exe build/client/Release/axlic_a0_fixture_cli.exe
          --build-dir build
          --state reference/vectors/a0/valid_state.json
          --implementation-revision ${{ github.sha }}
          --report evidence/a0-offline-no-server.json

      - name: Prove A2 production binary offline boundary
        run: >-
          python client/tests/verify_offline_boundary.py
          --exe build/client/Release/axlic.exe
          --build-dir build
          --state reference/vectors/a0/valid_state.json
          --expect-absent
          --implementation-revision ${{ github.sha }}
          --report evidence/a2-offline-no-server.json

      - name: Prove packaging-time trust floor export fails closed without a backend
        shell: pwsh
        run: |
          Copy-Item client/keyring/trust-floor.json evidence/trust-floor-before.json
          $env:VAULT_ADDR = ''
          $env:VAULT_TOKEN = ''
          python tools/fetch_trust_floor.py --key license-credential-v1 --out evidence/trust-floor.json
          if ($LASTEXITCODE -eq 0) { throw 'export tool must fail without a signing backend' }
          if (Compare-Object (Get-Content evidence/trust-floor-before.json) (Get-Content client/keyring/trust-floor.json)) {
            throw 'export tool overwrote the existing artifact on failure'
          }

      - name: Record build and toolchain identity
        run: >-
          python reference/tools/toolchain_report.py
          --build-dir build
          --implementation-revision ${{ github.sha }}
          --artifact-id AXL-V1-A2-build-toolchain
          --report evidence/build-toolchain.json

      - name: Upload reviewer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AXL-V1-A2-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 30
